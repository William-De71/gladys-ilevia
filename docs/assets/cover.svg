<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Ilévia integration for Gladys Assistant (illustration, not
       the logo of Ilévia). The belfries of Lille at dusk, a driverless VAL
       metro train on its viaduct, a bus below, and a screen of the stops
       announcing the next passages. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7fb3"/>
      <stop offset="0.6" stop-color="#c6d3e6"/>
      <stop offset="1" stop-color="#f3dcc2"/>
    </linearGradient>
    <linearGradient id="train" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f9"/>
      <stop offset="1" stop-color="#ccd1d8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4e66"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>

  <!-- the roofs of Lille, Flemish gables and two belfries -->
  <path d="M0 330 L0 262 L30 262 L30 240 L44 226 L58 240 L58 262 L96 262 L96 236 L110 222 L124 236 L124 262 L170 262 L170 150 L178 140 L178 120 L186 104 L194 120 L194 140 L202 150 L202 262 L250 262 L250 238 L266 222 L282 238 L282 262 L330 262 L330 244 L360 244 L360 262 L420 262 L420 232 L436 216 L452 232 L452 262 L520 262 L520 170 L528 160 L528 136 L538 116 L548 136 L548 160 L556 170 L556 262 L610 262 L610 236 L626 220 L642 236 L642 262 L700 262 L700 244 L740 244 L740 262 L800 262 L800 330 Z" fill="#9fb0c4"/>
  <rect x="0" y="330" width="800" height="204" fill="#8794a3"/>

  <!-- the viaduct of the metro -->
  <rect x="0" y="292" width="800" height="18" fill="#e5e7ea"/>
  <rect x="0" y="310" width="800" height="6" fill="#c0c5cc"/>
  <g fill="#d3d7dc">
    <rect x="70" y="316" width="26" height="110"/>
    <rect x="300" y="316" width="26" height="110"/>
    <rect x="530" y="316" width="26" height="110"/>
    <rect x="760" y="316" width="26" height="110"/>
  </g>

  <!-- the VAL train: two short cars, flat fronts, a yellow stripe -->
  <g transform="translate(90 220)">
    <rect x="0" y="0" width="250" height="72" rx="10" fill="url(#train)"/>
    <rect x="258" y="0" width="250" height="72" rx="10" fill="url(#train)"/>
    <rect x="0" y="50" width="508" height="8" fill="#f2b705"/>
    <g fill="url(#glass)">
      <rect x="12" y="12" width="40" height="28" rx="4"/>
      <rect x="64" y="12" width="56" height="28" rx="4"/>
      <rect x="132" y="12" width="56" height="28" rx="4"/>
      <rect x="200" y="12" width="40" height="28" rx="4"/>
      <rect x="270" y="12" width="40" height="28" rx="4"/>
      <rect x="322" y="12" width="56" height="28" rx="4"/>
      <rect x="390" y="12" width="56" height="28" rx="4"/>
      <rect x="458" y="12" width="40" height="28" rx="4"/>
    </g>
  </g>

  <!-- the bus on the street -->
  <g transform="translate(470 392)">
    <rect x="0" y="0" width="250" height="70" rx="12" fill="#f4f5f7"/>
    <rect x="0" y="48" width="250" height="10" fill="#d6336c"/>
    <g fill="#5d7fa3">
      <rect x="14" y="10" width="46" height="28" rx="4"/>
      <rect x="70" y="10" width="46" height="28" rx="4"/>
      <rect x="126" y="10" width="46" height="28" rx="4"/>
      <rect x="182" y="10" width="54" height="28" rx="4"/>
    </g>
    <circle cx="50" cy="72" r="15" fill="#15181d"/>
    <circle cx="200" cy="72" r="15" fill="#15181d"/>
    <circle cx="50" cy="72" r="6" fill="#6b7480"/>
    <circle cx="200" cy="72" r="6" fill="#6b7480"/>
  </g>

  <!-- the screen of the stop -->
  <g transform="translate(40 352)">
    <rect x="0" y="0" width="390" height="150" rx="14" fill="url(#screen)"/>
    <rect x="0" y="0" width="390" height="150" rx="14" fill="none" stroke="#3a4352" stroke-width="3"/>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">
      <rect x="20" y="20" width="40" height="26" rx="5" fill="#27348b"/>
      <text x="40" y="40" font-size="17" fill="#ffffff" text-anchor="middle">L1</text>
      <text x="72" y="40" font-size="19" fill="#e8eef6">Wambrechies</text>
      <text x="370" y="40" font-size="22" fill="#ffd166" text-anchor="end">2 min</text>
      <rect x="20" y="62" width="40" height="26" rx="5" fill="#00a0a8"/>
      <text x="40" y="82" font-size="17" fill="#ffffff" text-anchor="middle">L5</text>
      <text x="72" y="82" font-size="19" fill="#e8eef6">Haubourdin</text>
      <text x="370" y="82" font-size="22" fill="#ffd166" text-anchor="end">6 min</text>
      <rect x="20" y="104" width="40" height="26" rx="5" fill="#008c3c"/>
      <text x="40" y="124" font-size="17" fill="#ffffff" text-anchor="middle">50</text>
      <text x="72" y="124" font-size="19" fill="#e8eef6">Marcq Collège</text>
      <text x="370" y="124" font-size="22" fill="#ffd166" text-anchor="end">11 min</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="40" y="92" font-size="58" font-weight="bold" fill="#13263d">Ilévia Lille</text>
    <text x="42" y="136" font-size="25" fill="#1d3550">Bus, métro &amp; tram · temps réel · trafic</text>
    <text x="42" y="172" font-size="22" fill="#2a4766">pour Gladys Assistant</text>
  </g>
</svg>
